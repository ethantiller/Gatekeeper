name: gatekeeper

services:
  # Not a running service: only here so `docker compose build` builds the sandbox base image.
  sandbox-base:
    profiles: ["build"]
    image: gatekeeper-sandbox-base:latest
    build:
      context: .
      dockerfile: base.Dockerfile

  connection-logger:
    image: gatekeeper-connection-logger:latest
    build:
      context: ./connection_logger
    container_name: gk-connection-logger
    networks: [gk-sandbox]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s

networks:
  # internal: no route to the internet. Sandbox containers join this by name.
  gk-sandbox:
    name: gk-sandbox
    driver: bridge
    internal: true
    labels:
      com.gatekeeper.managed: "true"
