[project]
name = "gatekeeper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Tiller", email = "tilleres@mail.uc.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "bashlex>=0.18",
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=13,<17",
]

[project.scripts]
gatekeeper = "gatekeeper.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
